name: CI/CD - Docker FastAPI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate/update CHANGELOG.md from commit messages
      - name: Generate CHANGELOG
        if: github.actor != 'github-actions[bot]'
        run: |
          # Install github-changelog-generator
          gem install github_changelog_generator

          # Generate changelog
          github_changelog_generator \
            --user ${{ github.repository_owner }} \
            --project ${{ github.event.repository.name }} \
            --output CHANGELOG.md \
            --future-release "Unreleased" \
            --since-tag $(git describe --tags --abbrev=0 || echo "")

          # Commit only if there are changes
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add CHANGELOG.md
          git diff-index --quiet HEAD || git commit -m "ci: update CHANGELOG [skip ci]" && git push

      # Build Docker image (for testing)
      - name: Build Docker image
        run: |
          docker build -t ml-fastapi:test .

    #   # Run tests inside Docker
    #   - name: Run tests
    #     run: |
    #       docker run --rm ml-fastapi:test bash -c "pytest -q --disable-warnings"

      # Push Docker image to GHCR
      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/ml-fastapi:latest
            ghcr.io/${{ github.repository_owner }}/ml-fastapi:${{ github.sha }}
