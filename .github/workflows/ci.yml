name: CI/CD - Docker FastAPI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

    #   # Set up Python
    #   - name: Setup Python
    #     uses: actions/setup-python@v4
    #     with:
    #       python-version: 3.11

    #   # Install git-changelog
    #   - name: Install git-changelog
    #     run: pip install git-changelog

    #   - name: Generate/update CHANGELOG.md
    #     if: github.actor != 'github-actions[bot]'
    #     run: |
    #       # Generate changelog since last tag
    #       LAST_TAG=$(git describe --tags --abbrev=0 || echo "")
    #       git-changelog --output CHANGELOG.md --range "$LAST_TAG..HEAD"
          
    #       # Commit only if there are changes
    #       git config user.name "github-actions"
    #       git config user.email "github-actions@github.com"
    #       git add CHANGELOG.md
    #       git diff-index --quiet HEAD || git commit -m "ci: update CHANGELOG [skip ci]" && git push      

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Docker image (for testing)
      - name: Build Docker image
        run: |
          docker build -t ml-fastapi:test .

    #   # Run tests inside Docker
    #   - name: Run tests
    #     run: |
    #       docker run --rm ml-fastapi:test bash -c "pytest -q --disable-warnings"

      # Push Docker image to GHCR
      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/ml-fastapi:latest
            ghcr.io/${{ github.repository_owner }}/ml-fastapi:${{ github.sha }}
